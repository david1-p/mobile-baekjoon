name: Native build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --max-workers=2
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-arm64
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

  ios:
    runs-on: macos-26
    timeout-minutes: 70
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: mobile/ios
      - run: xcodebuild -workspace ios/PocketJudge.xcworkspace -scheme PocketJudge -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/pocket-build" CODE_SIGNING_ALLOWED=NO build
